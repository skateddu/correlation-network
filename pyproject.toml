[project]
name = "correlation-network"
version = "1.1.1"
description = "Build and analyze association networks from pandas DataFrames: correlations, Cramer's V, mutual information and PhiK, with centrality analysis and visualization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Andrea Cadeddu", email = "cadeddu7@gmail.com" },
]
keywords = [
    "correlation",
    "association",
    "network",
    "graph",
    "networkx",
    "pandas",
    "cramers-v",
    "mutual-information",
    "centrality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
phik = ["phik>=0.12.2"]
polars = [
    "polars>=0.20",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/skateddu/correlation-network"
Repository = "https://github.com/skateddu/correlation-network"
Issues = "https://github.com/skateddu/correlation-network/issues"
Changelog = "https://github.com/skateddu/correlation-network/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/correlation_network"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks end-to-end pipeline tests",
]
addopts = "-v --strict-markers"

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["correlation_network"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["phik"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]
typing = [
    "mypy>=1.18",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.15.3.0",
    "types-networkx>=3.6.1.20261006",
]

[tool.uv]
default-groups = ["dev", "typing"]
