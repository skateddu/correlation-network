[project]
name = "correlation-network"
version = "1.0.0"
description = "Build and analyze association networks from pandas DataFrames"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Andrea Cadeddu", email = "andrea.cadeddu@linkalab.it" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=3.4.2",
    "pandas>=2.3.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
phik = ["phik>=0.12"]
polars = [
    "polars>=0.20",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/skateddu/correlation-network"
Repository = "https://github.com/skateddu/correlation-network"
Issues = "https://github.com/skateddu/correlation-network/issues"
Changelog = "https://github.com/skateddu/correlation-network/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/correlation_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks end-to-end pipeline tests",
]
addopts = "-v --strict-markers"

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["correlation_network"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]
